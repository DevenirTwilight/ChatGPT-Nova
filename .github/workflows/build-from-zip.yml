name: Build ChatGPT Nova APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir project
          unzip ChatGPT-Nova-Secure-Source.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          NOVA_KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_B64 }}
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          mkdir -p project/signing
          printf '%s' "$NOVA_KEYSTORE_B64" | base64 --decode > project/signing/nova-personal-release.jks

          cat > project/keystore.properties <<EOF
          storeFile=signing/nova-personal-release.jks
          storePassword=$NOVA_STORE_PASSWORD
          keyAlias=$NOVA_KEY_ALIAS
          keyPassword=$NOVA_KEY_PASSWORD
          EOF

      - name: Build release APK
        run: |
          gradle -p project :app:clean :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir dist
          cp project/app/build/outputs/apk/release/app-release.apk dist/ChatGPT-Nova.apk
          sha256sum dist/ChatGPT-Nova.apk > dist/ChatGPT-Nova.apk.sha256

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ChatGPT-Nova.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Nova-release
          path: |
            dist/ChatGPT-Nova.apk
            dist/ChatGPT-Nova.apk.sha256
