name: Build ChatGPT Nova APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tracked source
        run: |
          python3 - <<'PYCODE'
          import subprocess
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          for name in files:
              path = Path(name)
              if path.suffix in ('.jks','.keystore') or path.name == 'keystore.properties':
                  raise SystemExit('Signing material must not be tracked')
          assert Path('app/build.gradle').is_file()
          assert Path('gradlew').is_file()
          PYCODE

      - name: Download original signed v1 for upgrade testing
        id: original-v1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ChatGPT-Nova-release
          run-id: 36923256012
          github-token: ${{ github.token }}
          path: baseline

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          NOVA_KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_B64 }}
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ('NOVA_KEYSTORE_B64', 'NOVA_STORE_PASSWORD', 'NOVA_KEY_ALIAS', 'NOVA_KEY_PASSWORD')
          for name in names:
              if not os.environ.get(name):
                  raise SystemExit('Missing required GitHub secret: ' + name)
          Path('signing').mkdir(exist_ok=True)
          key = Path('signing/nova-personal-release.jks')
          key.write_bytes(base64.b64decode(os.environ['NOVA_KEYSTORE_B64'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return ''.join({'\\':'\\\\', '\n':'\\n', '\r':'\\r', '\t':'\\t', '=':'\\=', ':':'\\:', ' ':'\\ '}.get(c,c) for c in value)
          props = Path('keystore.properties')
          props.write_text('storeFile=signing/nova-personal-release.jks\n' + ''.join(k+'='+escape(os.environ[v])+'\n' for k,v in (
              ('storePassword','NOVA_STORE_PASSWORD'), ('keyAlias','NOVA_KEY_ALIAS'), ('keyPassword','NOVA_KEY_PASSWORD'))))
          props.chmod(0o600)
          PY

      - name: Build release APK and separate instrumentation APK
        run: ./gradlew :app:clean :app:assembleRelease :app:assembleReleaseAndroidTest :app:lintRelease --stacktrace --no-daemon

      - name: Retain a reproducible v1 baseline if the original Artifact has expired
        run: |
          if [ -f baseline/ChatGPT-Nova.apk ]; then
            printf '%s\n' 'original Actions Artifact v1' > baseline/origin.txt
            printf '%s\n' 'a48fc6e95bf3b8dd1abc32c86cbee168de7931aa71a80867134b58da61dd2921  baseline/ChatGPT-Nova.apk' | sha256sum --check
          else
            mkdir -p baseline baseline-source
            git archive fee90be011ac72b6bbb972f0e91265469d2776ab | tar -x -C baseline-source
            cp keystore.properties baseline-source/keystore.properties
            cp signing/nova-personal-release.jks baseline-source/signing/nova-personal-release.jks
            gradle -p baseline-source :app:assembleRelease --no-daemon
            cp baseline-source/app/build/outputs/apk/release/app-release.apk baseline/ChatGPT-Nova.apk
            printf '%s\n' 'pinned v1 source rebuilt with the original release key' > baseline/origin.txt
          fi

      - name: Prepare and verify APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ChatGPT-Nova.apk
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk dist/ChatGPT-Nova-tests.apk
          cp baseline/ChatGPT-Nova.apk dist/ChatGPT-Nova-v1.apk
          cp baseline/origin.txt dist/baseline-origin.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ChatGPT-Nova.apk > dist/APK-signature.txt
          cat dist/APK-signature.txt
          grep -F "$(cat release-certificate.sha256)" dist/APK-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/ChatGPT-Nova-tests.apk > dist/tests-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/ChatGPT-Nova-v1.apk > dist/baseline-signature.txt
          grep -F "$(cat release-certificate.sha256)" dist/tests-signature.txt
          grep -F "$(cat release-certificate.sha256)" dist/baseline-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging dist/ChatGPT-Nova.apk > dist/APK-manifest.txt
          python3 - <<'PY'
          import zipfile, os, subprocess, re
          from pathlib import Path
          with zipfile.ZipFile('dist/ChatGPT-Nova.apk') as apk:
              assert 'AndroidManifest.xml' in apk.namelist()
              dex = [n for n in apk.namelist() if n.startswith('classes') and n.endswith('.dex')]
              assert dex and all(apk.read(n)[:4] == b'dex\n' for n in dex)
              assert not any(n.endswith(('.jks','.keystore')) or n.endswith('keystore.properties') for n in apk.namelist())
          manifest = Path('dist/APK-manifest.txt').read_text()
          assert "name='com.example.chatgptnova'" in manifest
          assert "targetSdkVersion:'35'" in manifest
          assert "versionCode='5'" in manifest
          assert "versionName='1.3.1'" in manifest
          assert 'application-debuggable' not in manifest
          with zipfile.ZipFile('dist/ChatGPT-Nova.apk') as apk:
              assert not any('FixtureDocuments' in apk.read(n).decode('latin1') for n in dex)
          assert 'com.example.chatgptnova.test.documents' not in manifest
          Path('dist/APK-dex.txt').write_text('DEX headers verified; no signing secrets packaged.\n')
          report = []
          aapt2 = os.path.join(os.environ['ANDROID_HOME'],'build-tools/35.0.0/aapt2')
          resources = subprocess.check_output([aapt2,'dump','resources','dist/ChatGPT-Nova.apk'],text=True)
          assert 'drawable/app_icon' not in resources, 'Old temporary icon is still packaged'
          for icon in ('ic_launcher','ic_launcher_round'):
              pattern = r'resource[^\n]*\bmipmap/'+re.escape(icon)+r'\s*\n(.*?)(?=\n\s*resource|\Z)'
              block = re.search(pattern,resources,re.S)
              assert block, 'Missing packaged launcher resource: '+icon
              path = re.search(r'v33\)[^\n]*?(res/[^\s\"]+\.xml)',block.group(1))
              assert path, 'Missing Android 13 themed configuration for '+icon+'\n'+block.group(1)
              name = path.group(1)
              tree = subprocess.check_output([aapt2,'dump','xmltree','dist/ChatGPT-Nova.apk','--file',name],text=True)
              assert all(layer in tree for layer in ('adaptive-icon','background','foreground','monochrome')), tree
              report.append(icon+' / Android 13+ / '+name+'\n'+tree)
          Path('dist/APK-branding.txt').write_text('\n'.join(report))
          PY
          (cd dist && sha256sum ChatGPT-Nova.apk > ChatGPT-Nova.apk.sha256)

      - name: Prepare complete source without signing secrets
        run: |
          python3 - <<'PY'
          import zipfile, subprocess
          from pathlib import Path
          root = Path('.')
          with zipfile.ZipFile('dist/ChatGPT-Nova-Secure-Source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  if not name or name == 'ChatGPT-Nova-Secure-Source.zip': continue
                  path = root / name
                  if not path.is_file(): continue
                  if path.name in ('keystore.properties','local.properties') or path.suffix in ('.jks','.keystore'): continue
                  archive.write(path, name)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Nova-release
          path: |
            dist/ChatGPT-Nova.apk
            dist/ChatGPT-Nova.apk.sha256
            dist/APK-*.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload complete source
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Nova-source
          path: dist/ChatGPT-Nova-Secure-Source.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload upgrade and WebView test inputs
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Nova-ci-inputs
          path: |
            dist/ChatGPT-Nova-tests.apk
            dist/ChatGPT-Nova-v1.apk
            dist/baseline-origin.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary signing material
        if: always()
        run: rm -f keystore.properties signing/nova-personal-release.jks baseline-source/keystore.properties baseline-source/signing/nova-personal-release.jks

  compatibility:
    name: Android ${{ matrix.api }} upgrade and WebView tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ChatGPT-Nova-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ChatGPT-Nova-ci-inputs
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installed Release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -dns-server 8.8.8.8,1.1.1.1
          script: |
            python3 scripts/upgrade_and_web_tests.py dist/ChatGPT-Nova.apk dist/ChatGPT-Nova-tests.apk dist/ChatGPT-Nova-v1.apk ${{ matrix.api }}
            python3 scripts/smoke_apk.py dist/ChatGPT-Nova.apk ${{ matrix.api }}
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Nova-Android-${{ matrix.api }}
          path: |
            smoke-results/
            instrumented-results/
          if-no-files-found: warn
          retention-days: 90
