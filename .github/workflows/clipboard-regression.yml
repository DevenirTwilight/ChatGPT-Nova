name: Clipboard regression

on:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/run_clipboard_tests.py'
      - '.github/workflows/clipboard-regression.yml'
  push:
    branches: [codex/fix-ime-clipboard]

permissions:
  contents: read

concurrency:
  group: clipboard-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: ./gradlew -PnovaTestBuildType=debug :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  clipboard:
    name: Android API ${{ matrix.api }} clipboard
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: clipboard-debug-apks
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          emulator-build: '15917651'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1
          script: python3 scripts/run_clipboard_tests.py dist/app-debug.apk dist/app-debug-androidTest.apk ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipboard-Android-${{ matrix.api }}
          path: clipboard-results/
          if-no-files-found: warn
