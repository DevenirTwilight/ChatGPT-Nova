name: DOM export trial APK
on:
  push:
    branches: [feature/export-conversation]
    paths:
      - 'app/**'
      - 'tools/dom-trial/**'
      - 'scripts/dom_trial_android.py'
      - '.github/workflows/dom-trial.yml'
  workflow_dispatch:
concurrency:
  group: nova-dom-trial-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser fixture checks
        env:
          NOVA_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          NOVA_PLAYWRIGHT_MODULE: /tmp/nova-dom-deps/node_modules/playwright-core
        run: |
          npm install --prefix /tmp/nova-dom-deps playwright-core@1.57.0 --no-audit --no-fund
          node tools/dom-trial/browser.test.cjs
      - name: Restore signing key
        env:
          NOVA_KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_B64 }}
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ('NOVA_KEYSTORE_B64', 'NOVA_STORE_PASSWORD', 'NOVA_KEY_ALIAS', 'NOVA_KEY_PASSWORD')
          for name in names:
              if not os.environ.get(name):
                  raise SystemExit('Missing required GitHub secret: ' + name)
          Path('signing').mkdir(exist_ok=True)
          key = Path('signing/nova-personal-release.jks')
          key.write_bytes(base64.b64decode(os.environ['NOVA_KEYSTORE_B64'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return ''.join({'\\':'\\\\', '\n':'\\n', '\r':'\\r', '\t':'\\t', '=':'\\=', ':':'\\:', ' ':'\\ '}.get(c,c) for c in value)
          props = Path('keystore.properties')
          props.write_text('storeFile=signing/nova-personal-release.jks\n' + ''.join(k+'='+escape(os.environ[v])+'\n' for k,v in (
              ('storePassword','NOVA_STORE_PASSWORD'), ('keyAlias','NOVA_KEY_ALIAS'), ('keyPassword','NOVA_KEY_PASSWORD'))))
          props.chmod(0o600)
          PY

      - name: Build and lint trial
        run: ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest :app:lintRelease --stacktrace --no-daemon
      - name: Verify original signature and trial identity
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ChatGPT-Nova.apk
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk dist/ChatGPT-Nova-tests.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ChatGPT-Nova.apk > dist/signature.txt
          grep -F "$(cat release-certificate.sha256)" dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/ChatGPT-Nova-tests.apk > dist/tests-signature.txt
          grep -F "$(cat release-certificate.sha256)" dist/tests-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging dist/ChatGPT-Nova.apk > dist/manifest.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          manifest = Path('dist/manifest.txt').read_text()
          assert "name='com.example.chatgptnova'" in manifest
          assert "versionCode='12'" in manifest and "versionName='1.3.8-dom-trial'" in manifest
          assert 'application-debuggable' not in manifest
          with zipfile.ZipFile('dist/ChatGPT-Nova.apk') as apk:
              assert 'assets/export/dom-trial.js' in apk.namelist()
              for name in apk.namelist():
                  assert not name.endswith(('.jks', '.keystore', 'keystore.properties'))
                  if name.startswith('classes') and name.endswith('.dex'):
                      assert b'FixtureDocuments' not in apk.read(name)
          PY
          (cd dist && sha256sum ChatGPT-Nova.apk > ChatGPT-Nova.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: nova-dom-trial-build
          path: dist/
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties signing/nova-personal-release.jks
  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nova-dom-trial-build
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: '15917651'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back emulated -dns-server 8.8.8.8,1.1.1.1
          script: python3 scripts/dom_trial_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-dom-trial-android35
          path: dom-trial-results/
          if-no-files-found: warn
  publish:
    needs: [build, android]
    if: github.ref == 'refs/heads/feature/export-conversation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nova-dom-trial-build
          path: dist
      - name: Publish signed trial with permanent download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum --check ChatGPT-Nova.apk.sha256)
          NOTES=$(mktemp)
          cat > "$NOTES" <<EOFNOTES
          新方案 DOM 导出试用版 1.3.8-dom-trial / code12，原发布证书签名，可覆盖安装。实现提交：${GITHUB_SHA}。

          菜单“导出已加载消息（试用）”提供 HTML、Markdown、系统保存为 PDF；“导出诊断”和报错弹窗可复制诊断。旧捕获器不再安装。

          只导出当前页面已加载的消息，完整项目长会话历史未确认。图片和附件不打包。没有证明旧403修复，改为不调用旧接口。真实账号与用户设备仍待验证。

          构建、lint、Chromium夹具与Android35五项导出集成夹具通过，包含系统实际保存PDF并检查首尾/代码/表格文字；不是全量输入、登录、分享回归或所有Android版本认证。

          使用与错误码：https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/dom-export-trial.md
          EOFNOTES
          gh release create "nova-dom-trial-${GITHUB_SHA::7}" dist/ChatGPT-Nova.apk dist/ChatGPT-Nova.apk.sha256 \
            --target "$GITHUB_SHA" --title "ChatGPT Nova 新方案导出试用版 (${GITHUB_SHA::7})" \
            --notes-file "$NOTES" --prerelease --latest=false
