name: Signed ARM64 Gecko trial delivery
on:
  push:
    branches: [feature/export-conversation]
    paths: ['.github/workflows/gecko-arm64-delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: nova-dom-trial-build
          path: original
          github-token: ${{ github.token }}
          run-id: '37509953925'
      - name: Ensure signing tools
        timeout-minutes: 5
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Restore signing key
        env:
          NOVA_KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_B64 }}
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ('NOVA_KEYSTORE_B64', 'NOVA_STORE_PASSWORD', 'NOVA_KEY_ALIAS', 'NOVA_KEY_PASSWORD')
          for name in names:
              if not os.environ.get(name):
                  raise SystemExit('Missing required GitHub secret: ' + name)
          Path('signing').mkdir(exist_ok=True)
          key = Path('signing/nova-personal-release.jks')
          key.write_bytes(base64.b64decode(os.environ['NOVA_KEYSTORE_B64'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return ''.join({'\\':'\\\\', '\n':'\\n', '\r':'\\r', '\t':'\\t', '=':'\\=', ':':'\\:', ' ':'\\ '}.get(c,c) for c in value)
          props = Path('keystore.properties')
          props.write_text('storeFile=signing/nova-personal-release.jks\n' + ''.join(k+'='+escape(os.environ[v])+'\n' for k,v in (
              ('storePassword','NOVA_STORE_PASSWORD'), ('keyAlias','NOVA_KEY_ALIAS'), ('keyPassword','NOVA_KEY_PASSWORD'))))
          props.chmod(0o600)
          PY

      - name: Retain only the original ARM64 native libraries
        run: |
          (cd original && sha256sum --check ChatGPT-Nova.apk.sha256)
          mkdir -p dist
          python3 - <<'PYCODE'
          import zipfile
          with zipfile.ZipFile('original/ChatGPT-Nova.apk') as source, zipfile.ZipFile('dist/unsigned.apk','w') as dest:
              for entry in source.infolist():
                  name=entry.filename
                  if name.startswith('lib/') and not name.startswith('lib/arm64-v8a/'): continue
                  upper=name.upper()
                  if upper=='META-INF/MANIFEST.MF' or (upper.startswith('META-INF/') and upper.endswith(('.SF','.RSA','.DSA','.EC'))): continue
                  entry.extra=b''
                  dest.writestr(entry,source.read(name))
          PYCODE
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 dist/unsigned.apk dist/aligned.apk
      - name: Sign with the original release certificate
        env:
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks signing/nova-personal-release.jks --ks-key-alias "$NOVA_KEY_ALIAS" --ks-pass env:NOVA_STORE_PASSWORD --key-pass env:NOVA_KEY_PASSWORD --out dist/ChatGPT-Nova.apk dist/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ChatGPT-Nova.apk > dist/signature.txt
          grep -F "$(cat release-certificate.sha256)" dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/ChatGPT-Nova.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging dist/ChatGPT-Nova.apk > dist/manifest.txt
          (cd dist && sha256sum ChatGPT-Nova.apk > ChatGPT-Nova.apk.sha256)
      - name: Verify byte-identical retained files and prepare bounded transfer
        run: |
          python3 - <<'PYCODE'
          import zipfile,hashlib,json
          from pathlib import Path
          with zipfile.ZipFile('original/ChatGPT-Nova.apk') as original, zipfile.ZipFile('dist/ChatGPT-Nova.apk') as apk:
              native={n.split('/')[1] for n in apk.namelist() if n.startswith('lib/')}
              assert native=={'arm64-v8a'},native
              retained=0
              for name in apk.namelist():
                  if name.upper().startswith('META-INF/'): continue
                  assert name in original.namelist() and apk.read(name)==original.read(name),name
                  retained+=1
              assert 'lib/arm64-v8a/libxul.so' in apk.namelist()
              assert all(n in apk.namelist() for n in original.namelist() if not n.startswith(('lib/','META-INF/')))
          manifest=Path('dist/manifest.txt').read_text()
          assert "versionCode='14'" in manifest and "versionName='1.4.0-scroll-trial'" in manifest
          assert "name='com.example.chatgptnova'" in manifest and 'application-debuggable' not in manifest
          package=Path('ChatGPT-Nova-ARM64.zip')
          with zipfile.ZipFile(package,'w',zipfile.ZIP_DEFLATED) as z:
              for name in ['ChatGPT-Nova.apk','ChatGPT-Nova.apk.sha256','signature.txt','manifest.txt']:z.write(Path('dist')/name,name)
          out=Path('package-chunks');out.mkdir();parts=[]
          with package.open('rb') as f:
              for index in range(6):
                  data=f.read(30*1024*1024)
                  if not data: break
                  name=f'part-{index:02d}';(out/name).write_bytes(data);parts.append({'name':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              assert not f.read(1),'Increase transfer slots'
          result={'sourceRun':37509953925,'buildRevision':'190113f9387cd55e9dc3eb816a57d666840a9b03','abi':'arm64-v8a','apkBytes':Path('dist/ChatGPT-Nova.apk').stat().st_size,'retainedFilesVerified':retained,'packageSha256':hashlib.sha256(package.read_bytes()).hexdigest(),'parts':parts}
          (out/'manifest.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: nova-gecko-arm64-package
          path: |
            dist/ChatGPT-Nova.apk
            dist/ChatGPT-Nova.apk.sha256
            dist/signature.txt
            dist/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nova-gecko-arm64-manifest
          path: package-chunks/manifest.json
      - uses: actions/upload-artifact@v4
        if: hashFiles('package-chunks/part-00') != ''
        with:
          name: nova-gecko-arm64-part-00
          path: package-chunks/part-00
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: hashFiles('package-chunks/part-01') != ''
        with:
          name: nova-gecko-arm64-part-01
          path: package-chunks/part-01
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: hashFiles('package-chunks/part-02') != ''
        with:
          name: nova-gecko-arm64-part-02
          path: package-chunks/part-02
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: hashFiles('package-chunks/part-03') != ''
        with:
          name: nova-gecko-arm64-part-03
          path: package-chunks/part-03
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: hashFiles('package-chunks/part-04') != ''
        with:
          name: nova-gecko-arm64-part-04
          path: package-chunks/part-04
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: hashFiles('package-chunks/part-05') != ''
        with:
          name: nova-gecko-arm64-part-05
          path: package-chunks/part-05
          compression-level: 0
      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties signing/nova-personal-release.jks
