name: Assemble large APK delivery parts
on:
  push:
    branches: [feature/export-conversation]
    paths: ['.github/workflows/large-apk-delivery.yml']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Tested DOM trial build run containing nova-dom-trial-build
        required: true
        default: '37509953925'
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '37509953925' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nova-dom-trial-build
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || '37509953925' }}
      - name: Validate and partition the existing signed APK without rebuilding
        run: |
          (cd dist && sha256sum --check ChatGPT-Nova.apk.sha256)
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile, hashlib, json, os
          out=Path('package-chunks');out.mkdir()
          package=Path('ChatGPT-Nova-package.zip')
          with zipfile.ZipFile(package,'w',zipfile.ZIP_DEFLATED) as z:
              for name in ['ChatGPT-Nova.apk','ChatGPT-Nova.apk.sha256','signature.txt','manifest.txt']:
                  z.write(Path('dist')/name,name)
          parts=[]
          with package.open('rb') as f:
              for index in range(16):
                  data=f.read(30*1024*1024)
                  if not data: break
                  name=f'part-{index:02d}';(out/name).write_bytes(data)
                  parts.append({'name':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              assert not f.read(1),'Increase partition slots before publishing this package'
          (out/'manifest.json').write_text(json.dumps({'sourceRun':int(os.environ['SOURCE_RUN_ID']),'packageSha256':hashlib.sha256(package.read_bytes()).hexdigest(),'parts':parts},indent=2))
          print('Delivery partitions:',len(parts),'total compressed bytes:',package.stat().st_size)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: nova-gecko-delivery-manifest
          path: package-chunks/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: hashFiles('package-chunks/part-00') != ''
        with:
          name: nova-gecko-delivery-part-00
          path: package-chunks/part-00
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: hashFiles('package-chunks/part-01') != ''
        with:
          name: nova-gecko-delivery-part-01
          path: package-chunks/part-01
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: hashFiles('package-chunks/part-02') != ''
        with:
          name: nova-gecko-delivery-part-02
          path: package-chunks/part-02
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: hashFiles('package-chunks/part-03') != ''
        with:
          name: nova-gecko-delivery-part-03
          path: package-chunks/part-03
