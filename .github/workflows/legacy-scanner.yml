name: Legacy scanner experimental validation
on:
  push:
    branches: [feature/export-conversation]
    paths:
      - 'app/src/main/assets/export/dom-trial.js'
      - 'app/src/main/assets/export/scroll-trial.js'
      - 'app/src/main/assets/export/progress-discovery.js'
      - 'app/src/main/assets/export/locate-text.js'
      - 'app/src/main/java/com/example/chatgptnova/ConversationExport.java'
      - 'app/src/main/java/com/example/chatgptnova/MainActivity.java'
      - 'app/src/main/java/com/example/chatgptnova/SnapshotWebView.java'
      - 'app/build.gradle'
      # Verify the retained experimental APK when packaged Archive display semantics change.
      - 'app/src/main/java/com/example/chatgptnova/archive/ArchiveModel.java'
      - 'app/src/main/java/com/example/chatgptnova/archive/ArchiveImporter.java'
      - 'app/src/main/java/com/example/chatgptnova/archive/ArchiveZip.java'
      - 'app/src/main/java/com/example/chatgptnova/archive/ArchiveAssetFiles.java'
      - 'app/src/androidTest/java/com/example/chatgptnova/DomTrialExportTest.java'
      - 'app/src/androidTest/java/com/example/chatgptnova/FixtureActivity.java'
      - 'app/src/androidTest/assets/**'
      - 'tools/dom-trial/**'
      - 'scripts/dom_trial_android.py'
      - '.github/workflows/legacy-scanner.yml'
  workflow_dispatch:
concurrency:
  group: nova-legacy-scanner-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  legacy-scanner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the hosted runner Android SDK
        timeout-minutes: 2
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Ensure required Android build packages
        timeout-minutes: 5
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser fixture checks
        env:
          NOVA_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          NOVA_PLAYWRIGHT_MODULE: /tmp/nova-dom-deps/node_modules/playwright-core
        run: |
          npm install --prefix /tmp/nova-dom-deps playwright-core@1.57.0 --no-audit --no-fund
          node tools/dom-trial/browser.test.cjs
          node tools/dom-trial/scroll.test.cjs
          node tools/dom-trial/progress.test.cjs
          node tools/dom-trial/locator.test.cjs
      - name: Restore signing key
        env:
          NOVA_KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_B64 }}
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ('NOVA_KEYSTORE_B64', 'NOVA_STORE_PASSWORD', 'NOVA_KEY_ALIAS', 'NOVA_KEY_PASSWORD')
          for name in names:
              if not os.environ.get(name):
                  raise SystemExit('Missing required GitHub secret: ' + name)
          Path('signing').mkdir(exist_ok=True)
          key = Path('signing/nova-personal-release.jks')
          key.write_bytes(base64.b64decode(os.environ['NOVA_KEYSTORE_B64'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return ''.join({'\\':'\\\\', '\n':'\\n', '\r':'\\r', '\t':'\\t', '=':'\\=', ':':'\\:', ' ':'\\ '}.get(c,c) for c in value)
          props = Path('keystore.properties')
          props.write_text('storeFile=signing/nova-personal-release.jks\n' + ''.join(k+'='+escape(os.environ[v])+'\n' for k,v in (
              ('storePassword','NOVA_STORE_PASSWORD'), ('keyAlias','NOVA_KEY_ALIAS'), ('keyPassword','NOVA_KEY_PASSWORD'))))
          props.chmod(0o600)
          PY

      - name: Build and lint explicit experimental APK
        run: ./gradlew -PnovaLegacyScanner=true :app:assembleRelease :app:assembleReleaseAndroidTest :app:lintRelease :app:testReleaseUnitTest --stacktrace --no-daemon
      - name: Verify original signature and trial identity
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ChatGPT-Nova.apk
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk dist/ChatGPT-Nova-tests.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ChatGPT-Nova.apk > dist/signature.txt
          grep -F "$(cat release-certificate.sha256)" dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/ChatGPT-Nova-tests.apk > dist/tests-signature.txt
          grep -F "$(cat release-certificate.sha256)" dist/tests-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging dist/ChatGPT-Nova.apk > dist/manifest.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          manifest = Path('dist/manifest.txt').read_text()
          assert "name='com.example.chatgptnova'" in manifest
          assert "versionCode='14'" in manifest and "versionName='1.4.0-scroll-trial'" in manifest
          assert 'application-debuggable' not in manifest
          with zipfile.ZipFile('dist/ChatGPT-Nova.apk') as apk:
              assert 'assets/export/dom-trial.js' in apk.namelist()
              assert 'assets/export/scroll-trial.js' in apk.namelist()
              assert 'assets/export/progress-discovery.js' in apk.namelist()
              assert 'assets/export/locate-text.js' in apk.namelist()
              assert 'assets/virtual-history.js' not in apk.namelist()
              assert not any(n.startswith('lib/') and n.endswith('.so') for n in apk.namelist()), 'Unexpected native engine'
              assert 'assets/licenses/GeckoView.txt' not in apk.namelist()
              for name in apk.namelist():
                  assert not name.endswith(('.jks', '.keystore', 'keystore.properties'))
                  if name.startswith('classes') and name.endswith('.dex'):
                      assert b'FixtureDocuments' not in apk.read(name)
                      assert b'org/mozilla/geckoview' not in apk.read(name)
                      assert b'GeckoPdfExporter' not in apk.read(name)
          PY
          python3 - <<'PY'
          import json, zipfile, os
          from pathlib import Path
          apk=Path('dist/ChatGPT-Nova.apk')
          with zipfile.ZipFile(apk) as z:
              abis=sorted({n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')})
          Path('dist/package-size.json').write_text(json.dumps({'sourceCommit':os.environ['GITHUB_SHA'],'apkBytes':apk.stat().st_size,'nativeAbis':abis},indent=2))
          PY
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > dist/release-runtime-dependencies.txt
          if grep -i geckoview dist/release-runtime-dependencies.txt; then exit 1; fi
          (cd dist && sha256sum ChatGPT-Nova.apk > ChatGPT-Nova.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: nova-legacy-scanner-build
          path: dist/
          if-no-files-found: error
      - name: APK for device testing (no public Release)
        uses: actions/upload-artifact@v4
        with:
          name: nova-legacy-scanner-apk
          path: |
            dist/ChatGPT-Nova.apk
            dist/ChatGPT-Nova.apk.sha256
            dist/signature.txt
            dist/package-size.json
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties signing/nova-personal-release.jks
  android:
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    needs: legacy-scanner-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nova-legacy-scanner-build
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/nova-dom-deps playwright-core@1.57.0 --no-audit --no-fund
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          emulator-build: '15917651'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back emulated -dns-server 8.8.8.8,1.1.1.1
          script: python3 scripts/dom_trial_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-legacy-scanner-android-${{ matrix.api }}
          path: |
            dom-trial-results/
          if-no-files-found: warn
