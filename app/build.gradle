plugins {
    id 'com.android.application'
}

final java.util.Properties signingProps = new java.util.Properties()
final File signingPropsFile = rootProject.file('keystore.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

// Opt in explicitly for personal/research builds; debug is also off by default.
final String legacyScanner = providers.gradleProperty('novaLegacyScanner').getOrElse('false')
if (!(legacyScanner in ['true', 'false'])) throw new GradleException('novaLegacyScanner must be true or false')

final String trialRevision = System.getenv('GITHUB_SHA') ?: 'local'
final String safeTrialRevision = trialRevision.matches('[0-9a-f]{40}') ? trialRevision : 'local'

android {
    namespace 'com.example.chatgptnova'
    compileSdk 35
    buildToolsVersion '35.0.0'
    testBuildType project.hasProperty('novaExportTests') ? 'debug' : 'release'
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.example.chatgptnova'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 14
        versionName '1.4.0-scroll-trial'
        buildConfigField 'boolean', 'ENABLE_LEGACY_SCANNER', legacyScanner
        buildConfigField 'String', 'EXPORT_REVISION', '"'+safeTrialRevision+'"'
    }

    signingConfigs {
        release {
            if (signingPropsFile.exists()) {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.commonmark:commonmark:0.21.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.21.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'junit:junit:4.13.2'
}
